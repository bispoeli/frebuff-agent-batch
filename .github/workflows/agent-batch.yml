name: Agent Batch (Fazenda de Agentes OpenCode)

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Lista de tarefas (uma por linha, começando com - ou *)'
        required: false
        default: ''
      model:
        description: 'Modelo LLM (default: opencode/deepseek-v4.1-flash-free)'
        required: false
        default: 'opencode/deepseek-v4.1-flash-free'
      parallel:
        description: 'Número máximo de agentes simultâneos'
        required: false
        default: '5'
      create_prs:
        description: 'Criar Pull Requests automaticamente'
        required: false
        default: 'true'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-batch-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ETAPA 1: Parsing das tarefas da issue
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  parse-tasks:
    name: 📋 Parsing de Tarefas
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.parse.outputs.tasks }}
      task_count: ${{ steps.parse.outputs.task_count }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
      issue_title: ${{ steps.parse.outputs.issue_title }}
    steps:
      - name: Extrair tarefas da issue
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            ISSUE_NUMBER=${{ github.event.issue.number }}
            ISSUE_TITLE="${{ github.event.issue.title }}"
            ISSUE_BODY="${{ github.event.issue.body }}"
          else
            ISSUE_NUMBER=0
            ISSUE_TITLE="Workflow Dispatch"
            ISSUE_BODY="${{ github.event.inputs.tasks }}"
          fi

          # Extrair tarefas (linhas que começam com - ou *, ignorando cabeçalhos markdown)
          TASKS=$(echo "$ISSUE_BODY" | grep -E '^[-*] ' | sed 's/^[-*] //' | grep -v '^$' | grep -v '^## ' | grep -v '^### ')
          TASK_COUNT=$(echo "$ISSUE_BODY" | grep -cE '^[-*] ' || echo 0)

          # Serializar tarefas para output (separadas por |||)
          TASKS_SERIALIZED=$(echo "$TASKS" | tr '\n' '|||' | sed 's/|||$//')

          echo "tasks=$TASKS_SERIALIZED" >> $GITHUB_OUTPUT
          echo "task_count=$TASK_COUNT" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT

          # Gerar array de índices para o matrix strategy
          INDICES="["
          for i in $(seq 0 $((TASK_COUNT - 1))); do
            if [ $i -gt 0 ]; then INDICES+=","; fi
            INDICES+="$i"
          done
          INDICES+="]"
          echo "task_indices=$INDICES" >> $GITHUB_OUTPUT

          echo "📋 ${TASK_COUNT} tarefa(s) extraída(s) da issue #${ISSUE_NUMBER}"
          echo "$TASKS" | while read -r t; do echo "   • $t"; done

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ETAPA 2: Execução paralela dos agentes (matriz)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  agent-batch:
    name: 🤖 Executar Agentes em Paralelo
    needs: parse-tasks
    if: needs.parse-tasks.outputs.task_count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      max-parallel: ${{ github.event.inputs.parallel || 5 }}
      fail-fast: false
      matrix:
        task_index: ${{ fromJson(needs.parse-tasks.outputs.task_indices) }}
    env:
      TASK_INDEX: ${{ matrix.task_index }}
    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧰 Instalar Hermes Agent
        run: |
          pip install --upgrade pip
          pip install hermes-agent
          hermes --version

      - name: 📝 Extrair texto da tarefa
        id: get-task
        run: |
          TASKS="${{ needs.parse-tasks.outputs.tasks }}"
          TASK_INDEX=${{ matrix.task_index }}
          TASK=$(echo "$TASKS" | tr '|||' '\n' | sed -n "$((TASK_INDEX + 1))p")
          echo "task=$TASK" >> $GITHUB_OUTPUT
          echo "📝 Tarefa ${{ matrix.task_index + 1}}: $TASK"

      - name: 🌿 Criar branch isolada
        id: create-branch
        run: |
          # Sanitizar nome da tarefa para branch
          BRANCH_SLUG=$(echo "${{ steps.get-task.outputs.task }}" \
            | tr '[:upper:]' '[:lower:]' \
            | tr ' ' '-' \
            | sed 's/[^a-z0-9-]//g' \
            | cut -c1-40)
          BRANCH_NAME="agent-${{ matrix.task_index + 1}}-${BRANCH_SLUG}"
          git checkout -b "$BRANCH_NAME"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "🌿 Branch: $BRANCH_NAME"

      - name: ⚙️ Configurar Hermes
        run: |
          hermes setup --non-interactive \
            --provider openrouter \
            --model opencode/deepseek-v4.1-flash-free \
            --api-key "${{ secrets.OPENROUTER_API_KEY }}" || true

      - name: 🚀 Executar agente OpenCode
        id: run-agent
        run: |
          TASK="${{ steps.get-task.outputs.task }}"
          MODEL="${{ github.event.inputs.model || 'opencode/deepseek-v4.1-flash-free' }}"
          
          echo "🚀 Agente ${{ matrix.task_index + 1}} iniciando..."
          echo "   Tarefa: $TASK"
          echo "   Modelo: $MODEL"
          
          # Executar Hermes com contexto limpo (--no-restore-cwd) e auto-aprovar (--yolo)
          hermes chat --no-restore-cwd --yolo -m "$MODEL" "$TASK" 2>&1 || true
          
          echo "✅ Agente ${{ matrix.task_index + 1}} finalizado"

      - name: 📦 Commit e push das mudanças
        id: commit-push
        run: |
          BRANCH_NAME="${{ steps.create-branch.outputs.branch }}"
          git add -A
          
          # Verificar se há mudanças para commitar
          if git diff --staged --quiet; then
            echo "⚠️  Nenhuma mudança para commitar no agente ${{ matrix.task_index + 1}}"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "feat(agent-${{ matrix.task_index + 1}}): ${{ steps.get-task.outputs.task }}"
            git push origin "$BRANCH_NAME"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📤 Alterações enviadas para branch $BRANCH_NAME"
          fi

      - name: 🔗 Criar Pull Request
        if: github.event.inputs.create_prs != 'false' && steps.commit-push.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = `${{ steps.create-branch.outputs.branch }}`;
            const task = `${{ steps.get-task.outputs.task }}`;
            const agentNum = ${{ matrix.task_index + 1 }};
            
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 Agent ${agentNum}: ${task}`,
              head: branchName,
              base: 'main',
              body: `## 🤖 Agente OpenCode #${agentNum}\n\n**Tarefa:** ${task}\n\n**Modelo:** ${{ github.event.inputs.model || 'opencode/deepseek-v4.1-flash-free' }}\n\n**Branch:** \`${branchName}\`\n\n---\nEste PR foi criado automaticamente pela **Fazenda de Agentes OpenCode** via GitHub Actions.\n\nCada agente executa em uma **VM Linux isolada e descartável**, com contexto limpo (sem histórico de sessão anterior).\n\n---\n*Executado via GitHub Actions - Fazenda de Agentes*`
            });
            
            console.log(`✅ PR criado: ${pr.data.html_url}`);
            return pr.data.html_url;

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ETAPA 3: Comentário final na issue com resumo
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  comment-on-issue:
    name: 💬 Comentar na Issue
    needs: [parse-tasks, agent-batch]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Postar resumo na issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ needs.parse-tasks.outputs.issue_number || 0 }};
            const taskCount = ${{ needs.parse-tasks.outputs.task_count || 0 }};
            const agentResult = ${{ needs.agent-batch.result || 'skipped' }};
            
            let body = '';
            if (taskCount > 0) {
              body = `✅ **Fazenda de Agentes Concluída**\n\n`;
              body += `Processadas **${taskCount} tarefa(s)** na issue #${issueNumber}.\n`;
              body += `Status da execução: ${agentResult}\n\n`;
              body += `Cada tarefa foi executada em uma **VM Linux isolada e descartável** via GitHub Actions.\n`;
              body += `Cada agente criou sua própria branch e (se aplicável) um Pull Request separado.\n\n`;
              body += `---\n`;
              body += `*Modelo: ${{ github.event.inputs.model || 'opencode/deepseek-v4.1-flash-free' }} (custo zero de LLM)*\n`;
              body += `*Executor: GitHub Actions - Fazenda de Agentes OpenCode*\n`;
            } else {
              body = `ℹ️ Nenhuma tarefa válida encontrada na issue #${issueNumber}.\n\n`;
              body += `Use o formato:\n- Tarefa 1\n- Tarefa 2\n- Tarefa 3`;
            }
            
            github.rest.issues.createComment({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
