name: Agent Batch (Fazenda de Agentes OpenCode)

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Lista de tarefas (uma por linha)'
        required: false
        default: ''
      model:
        description: 'Modelo a usar (default: opencode/deepseek-v4.1-flash-free)'
        required: false
        default: 'opencode/deepseek-v4.1-flash-free'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          pip install --upgrade pip
          pip install hermes-agent
          hermes --version

      - name: Run Agent Batch (parallel execution)
        run: |
          python3 << 'PYEOF'
import os
import re
import subprocess
import concurrent.futures
from concurrent.futures import ThreadPoolExecutor

# Obter tarefas da issue
if os.environ.get('GITHUB_EVENT_NAME') == 'issues':
    issue_body = os.environ.get('ISSUE_BODY', '')
    issue_number = os.environ.get('ISSUE_NUMBER', '0')
else:
    issue_body = os.environ.get('INPUT_TASKS', '')
    issue_number = '0'

# Extrair tarefas (linhas que começam com - ou *)
tasks = []
for line in issue_body.split('\n'):
    line = line.strip()
    if re.match(r'^[-*] ', line):
        task = re.sub(r'^[-*] ', '', line)
        if task and task.strip():
            tasks.append(task.strip())

print(f"📋 {len(tasks)} tarefa(s) encontrada(s)")
for i, t in enumerate(tasks):
    print(f"   {i+1}. {t}")

if not tasks:
    print("❌ Nenhuma tarefa válida encontrada")
    exit(1)

# Configurar Hermes
print("⚙️  Configurando Hermes...")
subprocess.run([
    'hermes', 'setup', '--non-interactive',
    '--provider', 'openrouter',
    '--model', 'opencode/deepseek-v4.1-flash-free',
    '--api-key', os.environ.get('OPENROUTER_API_KEY', '')
], capture_output=True)

model = os.environ.get('INPUT_MODEL', 'opencode/deepseek-v4.1-flash-free')
repo = os.environ.get('GITHUB_REPOSITORY', '')

def run_agent(task_data):
    idx, task = task_data
    branch_name = f"agent-{idx+1}-{re.sub(r'[^a-z0-9]', '-', task.lower())[:30]}"
    
    try:
        # Criar branch
        subprocess.run(['git', 'checkout', '-b', branch_name], check=True, capture_output=True)
        print(f"🌿 Branch criada: {branch_name}")
        
        # Executar Hermes
        print(f"🤖 Executando agente {idx+1}: {task[:50]}...")
        result = subprocess.run([
            'hermes', 'chat', '--no-restore-cwd', '--yolo',
            '-m', model, task
        ], capture_output=True, text=True, timeout=300)
        
        if result.returncode == 0:
            print(f"✅ Agente {idx+1} concluído com sucesso")
        else:
            print(f"⚠️  Agente {idx+1} finalizado com código {result.returncode}")
            print(f"   stderr: {result.stderr[:200]}")
        
        # Commit e push
        subprocess.run(['git', 'add', '-A'], capture_output=True)
        commit_msg = f"feat(agent-{idx+1}): {task}"
        subprocess.run(['git', 'commit', '-m', commit_msg], capture_output=True)
        subprocess.run(['git', 'push', 'origin', branch_name], capture_output=True)
        print(f"📤 Branch {branch_name} enviada")
        
        # Criar PR via API
        import urllib.request, json
        token = os.environ.get('GITHUB_TOKEN', '')
        pr_data = json.dumps({
            'title': f'🤖 Agent {idx+1}: {task[:60]}',
            'head': branch_name,
            'base': 'main',
            'body': f'## Agente OpenCode\n\n**Tarefa:** {task}\n\n**Agente:** {idx+1}\n\nEste PR foi criado automaticamente pela fazenda de agentes OpenCode via GitHub Actions.\n\n---\n*Executado em VM isolada e descartável.*'
        }).encode()
        
        req = urllib.request.Request(
            f'https://api.github.com/repos/{repo}/pulls',
            data=pr_data,
            headers={
                'Authorization': f'token {token}',
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json'
            },
            method='POST'
        )
        try:
            resp = urllib.request.urlopen(req)
            pr = json.loads(resp.read())
            print(f"🔗 PR criado: {pr['html_url']}")
        except Exception as e:
            print(f"⚠️  Falha ao criar PR: {e}")
        
        return {'idx': idx+1, 'task': task, 'branch': branch_name, 'status': 'success'}
        
    except Exception as e:
        print(f"❌ Erro no agente {idx+1}: {e}")
        return {'idx': idx+1, 'task': task, 'branch': branch_name, 'status': 'failed', 'error': str(e)}

# Executar agentes em paralelo (máximo 5 simultâneos)
print(f"\n🚀 Iniciando execução paralela de {len(tasks)} agentes (máx. 5 simultâneos)...\n")

results = []
with ThreadPoolExecutor(max_workers=5) as executor:
    futures = {executor.submit(run_agent, (i, t)): i for i, t in enumerate(tasks)}
    for future in concurrent.futures.as_completed(futures):
        results.append(future.result())

# Resumo
print("\n" + "="*60)
print("📊 RESUMO DA FAZENDA DE AGENTES")
print("="*60)
success = sum(1 for r in results if r['status'] == 'success')
failed = sum(1 for r in results if r['status'] == 'failed')
print(f"✅ Sucessos: {success}")
print(f"❌ Falhas: {failed}")
print(f"📦 Total: {len(results)}")
print("\nDetalhes:")
for r in sorted(results, key=lambda x: x['idx']):
    status_icon = "✅" if r['status'] == 'success' else "❌"
    print(f"   {status_icon} Agente {r['idx']}: {r['task'][:50]}")
print("="*60)
PYEOF

      - name: Comment on issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ github.event.issue.number || 0 }};
            const body = `✅ **Fazenda de Agentes Concluída**\n\nProcessadas tarefas na issue #${issueNumber}.\n\nCada tarefa foi executada em uma VM Linux isolada e descartável via GitHub Actions.\n\nVerifique a guia "Actions" para ver os detalhes de execução de cada agente.\n\n---\n*Modelo: opencode/deepseek-v4.1-flash-free (custo zero de LLM)*`;
            github.rest.issues.createComment({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });